[package]
name = "video_collector_export"
version = "0.45.0"
edition = "2021"
license = "MIT"

[lib]
name = "video_collector_export"
path = "src/lib.rs"

[[bin]]
name = "vc_export"
path = "src/main.rs"

[[bin]]
name = "vc_add"
path = "src/bin/vc_add.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# blocking (not async reqwest+tokio): the rest of this crate is already
# synchronous (rusqlite), and the online-search module only ever runs a
# handful of short-lived calls, one per source, from their own threads.
reqwest = { version = "0.12", features = ["blocking", "json"] }
