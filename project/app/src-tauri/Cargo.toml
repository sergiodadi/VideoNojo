[package]
name = "videonojo"
version = "0.19.0"
description = "VideoNojo"
authors = ["Serge"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "videonojo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# The CLI tools' shared library (../../src/lib.rs) — reused as-is for
# reading/writing a collection, rather than duplicating the joins.
video_collector_export = { path = "../.." }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
